
spring.application.name=smartserv

# Server
server.port=${PORT:8080}
server.shutdown=graceful

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update

# Security
logging.level.org.springframework.security=debug

# JWT
jwt.secret=${JWT_SECRET:SmartServSuperSecretKeyForJWTTokenGeneration2026MustBeAtLeast32BytesLongSecretKey!}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.secure-cookie=${SECURE_COOKIE:false}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Invoice
invoice.tax.percentage=${INVOICE_TAX_PERCENTAGE:18}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS}